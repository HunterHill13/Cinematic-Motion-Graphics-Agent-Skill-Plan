style_name: "Cinematic Scientific Medical Explainer"
style_image_prompt: >
  Deep navy and cyan scientific visualization, intricate cellular organelles,
  soft volumetric rim lighting, deep shadows, shallow depth of field,
  crystallographic molecular shaders, 16:9, clean scientific diagramming.
style_video_prompt: >
  Cinematic macro camera push into biological structures, steady controlled drift,
  smooth spring-based protein cluster transitions, glowing cyan energy pathways,
  consistent deep space biological diorama.
avoid_negative_prompt: >
  no flat 2D cartoon icons, no generic Canva slides, no blurry low-res textures,
  no jarring handheld shake, no comic sans, no overlapping text collisions,
  no unmotivated frantic motion.
locked_palette:
  base: "#070B14"
  surface: "#0E1726"
  hero: "#06B6D4"
  accent: "#10B981"
  text: "#F8FAFC"
locked_typography:
  heroFont: "Orbitron"
  displayFont: "Exo 2"
  bodyFont: "Noto Sans SC"
