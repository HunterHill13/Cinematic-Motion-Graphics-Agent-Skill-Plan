  script_performance_sections:
    - section: "Intro (Cancer Survival)"
      shot: "Shot01"
      emotion: "Curious, investigative"
      pacing: "Deliberate, clear pauses"
      spoken_farsi: "سلول‌های سرطانی با پروتئین BCL-2، مسیر مرگ سلولی را مسدود می‌کنند."
      phonetic_prompt: "سلول‌های سرطانی با پروتئین بی‌سی‌اِل دو، مسیر مرگ سلولی را مسدود می‌کنند."
      emphasis_words: ["سرطانی", "بی‌سی‌اِل دو", "مسدود"]

    - section: "The Attack (BH3 Inhibition)"
      shot: "Shot02"
      emotion: "Focused, precise, technical"
      pacing: "Energetic acceleration"
      spoken_farsi: "اما داروهای هدفمند، با مهار این سپر، قفل محافظتی را می‌شکنند."
      phonetic_prompt: "اما داروهای هدفمند، با مهار این سپر، قفل محافظتی را می‌شکنند."
      emphasis_words: ["داروهای هدفمند", "سپر", "می‌شکنند"]

    - section: "The Rupture (MOMP)"
      shot: "Shot03"
      emotion: "Dramatic, climactic revelation"
      pacing: "Expansive, breath before disclosure"
      spoken_farsi: "اینجاست که منافذ میتوکندری باز شده و سیتوکروم سی آزاد می‌شود."
      phonetic_prompt: "اینجاست که منافذ میتوکندری باز شده و سیتوکْرومِ سی آزاد می‌شود."
      emphasis_words: ["منافذ", "میتوکندری", "سیتوکْرومِ سی"]

    - section: "Execution (Apoptosome)"
      shot: "Shot04"
      emotion: "Triumphant, definitive conclusion"
      pacing: "Decisive, authoritative finish"
      spoken_farsi: "با تشکیل کمپلکس آپوپتوزوم، فرمان خودکشی سلول با موفقیت صادر می‌شود."
      phonetic_prompt: "با تشکیل کمپلکس آپوپْتوزوم، فرمان خودکشی سلول با موفقیت صادر می‌شود."
