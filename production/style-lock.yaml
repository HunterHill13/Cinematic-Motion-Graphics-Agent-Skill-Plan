style_name: "Cinematic Oncology Bio-Visualization"
style_image_prompt: >
  Deep navy and cyan intracellular environment, crystalline outer mitochondrial membrane,
  biomolecular complexes glowing with cyan and emerald accents, volumetric light shafts,
  shallow depth of field, 16:9 widescreen, clean scientific typography.
style_video_prompt: >
  Smooth cinematic macro camera glide through cellular cytoplasm, steady 1.05 micro-push,
  snappy spring-loaded protein assemblies, glowing energy cascades, 30 fps fluid dynamics.
avoid_negative_prompt: >
  no cartoon 2D vector blobs, no generic Canva slides, no unmotivated handheld shaking,
  no unreadable micro-text, no clashing saturated neon colors, no zero-easing linear motion.
locked_palette:
  base: "#070B14"
  surface: "#0E1726"
  surfaceElevated: "#17253B"
  hero: "#06B6D4"
  heroGlow: "rgba(6, 182, 212, 0.45)"
  accent: "#10B981"
  alert: "#EF4444"
  text: "#F8FAFC"
  textMuted: "#94A3B8"
locked_typography:
  heroFont: "Orbitron"
  displayFont: "Exo 2"
  bodyFont: "Noto Sans SC"
