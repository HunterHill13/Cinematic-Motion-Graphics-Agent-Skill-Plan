visual_beat_map:
  fps: 30
  total_frames: 900
  total_duration_seconds: 30.0

  beats:
    - frame: 0
      time_s: 0.0
      event: "establish_cancer_cell"
      narration_cue: "سلول‌های سرطانی..."
      motion_action: "Seed pulse establishes, cristae folds unfold with spring easing"
      camera_action: "Slow dolly forward (1.00 -> 1.03)"
      sfx_cue: "ambient_hum"

    - frame: 45
      time_s: 1.5
      event: "bcl2_shield_lock"
      narration_cue: "با پروتئین BCL-2"
      motion_action: "BCL-2 outer ring snaps into fortified state, red warning aura"
      camera_action: "Subtle micro-shake on ring impact"
      sfx_cue: "whoosh-fast"

    - frame: 120
      time_s: 4.0
      event: "survival_trap"
      narration_cue: "مسیر مرگ سلولی را مسدود می‌کنند"
      motion_action: "Core particle trapped inside barrier, kinetic anticipation begins"
      sfx_cue: null

    - frame: 210
      time_s: 7.0
      event: "morph_transition_01_to_02"
      narration_cue: "اما داروهای هدفمند..."
      motion_action: "Shield compresses, BH3 vector locks onto target coordinate"
      camera_action: "Camera rotates 4 degrees"
      sfx_cue: "whoosh-fast"

    - frame: 245
      time_s: 8.16
      event: "bh3_kinetic_entry"
      narration_cue: "با مهار این سپر..."
      motion_action: "BH3 peptide accelerates along diagonal vector with energy trail"
      camera_action: "Follower tilt towards impact site"
      sfx_cue: "whoosh-fast"

    - frame: 310
      time_s: 10.33
      event: "bh3_shield_impact"
      narration_cue: "قفل مهارکننده را می‌شکنند"
      motion_action: "Impact shockwave detonates, BCL-2 ring fractures into shards"
      camera_action: "Sharp impact camera shake (5px amplitude, 8 frames)"
      sfx_cue: "bass-hit-futuristic"

    - frame: 430
      time_s: 14.33
      event: "morph_transition_02_to_03"
      narration_cue: "اینجاست که منافذ میتوکندری باز می‌شوند"
      motion_action: "Impact locus dilates into the center opening of MOMP"
      camera_action: "Fast vertical dive (slide upwards into pore)"
      sfx_cue: "bass-hit-futuristic"

    - frame: 480
      time_s: 16.0
      event: "momp_pore_eruption"
      narration_cue: "و سیتوکروم سی..."
      motion_action: "Pore ring expands, 8 Cytochrome c particles blast radially into cytoplasm"
      camera_action: "Pull back revealing relativistic particle drift"
      sfx_cue: "whoosh-fast"

    - frame: 600
      time_s: 20.0
      event: "cytosol_flood"
      narration_cue: "به درون سیتوپلاسم سرازیر می‌شود"
      motion_action: "Particles disperse, glow trails expand, decelerating to form geometric nodes"
      sfx_cue: "transition-soft"

    - frame: 668
      time_s: 22.26
      event: "morph_transition_03_to_04"
      narration_cue: "با تشکیل کمپلکس آپوپتوزوم..."
      motion_action: "7 particles lock into hexagonal/heptameric coordinates"
      camera_action: "Slow spiral camera rotation (0 to 180 degrees)"
      sfx_cue: "transition-soft"

    - frame: 720
      time_s: 24.0
      event: "apoptosome_wheel_lock"
      narration_cue: "چرخ مرگ سلولی فعال می‌شود"
      motion_action: "Apaf-1 spokes interlock, central Caspase-9 enzyme ignites"
      camera_action: "Final forward zoom (1.00 -> 1.08)"
      sfx_cue: "bass-hit-futuristic"

    - frame: 840
      time_s: 28.0
      event: "cellular_cleavage_climax"
      narration_cue: "و تخریب برنامه‌ریزی‌شده آغاز می‌گردد"
      motion_action: "Shockwave expands to frame boundary, programmatic resolution"
      sfx_cue: "transition-soft"
