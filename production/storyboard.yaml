shots:
  - shot_id: "S01"
    start_frame: 0
    end_frame: 300
    purpose: "Establish oncogenic stress and malignant evasion challenge"
    narration: "Inside a cancer cell, intense metabolic stress normally triggers programmed cell death."
    hero_element: "Intracellular Oncogenic Stress Core"
    secondary_elements:
      - "DNA break markers"
      - "Hypoxia indicators"
    camera:
      shot_size: "Macro Wide"
      angle: "10 degree perspective tilt"
      movement: "Micro push 1.00 -> 1.05"
      depth: "1200px"
    composition: "Hero cell body centered at (960, 520) with radiating cyan/amber tension halos"
    motion: "Pulsing stress rings expand outward; headline reveals word-by-word"
    lighting: "Ambient deep navy with warm alert highlights on DNA breaks"
    typography: "Hero headline 'HALLMARK OF CANCER', subtitle 'ONCOGENIC STRESS ACCUMULATION'"
    transition: "push-through into mitochondrial membrane at frame 286-300"
    sound: "Deep sub-harmonic hum, subtle warning ping at frame 25"
    technical_notes: "Hold final state for 35 frames before push-through"

  - shot_id: "S02"
    start_frame: 300
    end_frame: 600
    purpose: "Demonstrate BCL-2 protective blockade sequestering BAX"
    narration: "Yet malignant cells survive by overexpressing BCL-2, trapping pro-apoptotic killers."
    hero_element: "BCL-2 / BAX Inactivation Complex"
    secondary_elements:
      - "Outer mitochondrial membrane lipid bilayer"
      - "Inactivated BAX monomers"
    camera:
      shot_size: "Medium Close-up"
      angle: "Straight-on 2.5D elevation"
      movement: "Subtle drift with 1.04 micro-push"
      depth: "1000px"
    composition: "Split mechanism: BCL-2 sentinel card on left, locked BAX on right"
    motion: "BCL-2 clamps down with spring damping; lock icon illuminates"
    lighting: "Cyan membrane rim light; amber warning glow on BCL-2 shield"
    typography: "Headline 'BCL-2 MOLECULAR SHIELD', metric 'OVEREXPRESSION: 4.8x'"
    transition: "whip-pan lateral wipe at frame 586-600"
    sound: "Mechanical magnetic clack at frame 360, subtle lock chime"
    technical_notes: "Previous hero yields via demoteAt at frame 315"

  - shot_id: "S03"
    start_frame: 600
    end_frame: 900
    purpose: "Show MOMP pore formation and Cytochrome c egress"
    narration: "When BAX breaks free, it oligomerizes into macropores, releasing Cytochrome c."
    hero_element: "BAX/BAK Oligomeric Membrane Pore"
    secondary_elements:
      - "Cytochrome c particles"
      - "Depolarizing mitochondrial matrix"
    camera:
      shot_size: "Extreme Close-up"
      angle: "Normal orthogonal surface view"
      movement: "Accelerated dive into pore 1.00 -> 1.06"
      depth: "1400px"
    composition: "Pore ring expands from center, particles radiate into cytoplasmic space"
    motion: "8-subunit BAX ring snaps into place; glowing Cytochrome c particles stream outward"
    lighting: "Intense cyan glow at pore center, soft emerald particles"
    typography: "Headline 'MOMP ACTIVATION', subtext 'CYTOCHROME C EGRESS'"
    transition: "overexpose-flip white energy bloom at frame 886-900"
    sound: "Pore snap whoosh at frame 660, crystalline release chime"
    technical_notes: "Particle system deterministic functions only"

  - shot_id: "S04"
    start_frame: 900
    end_frame: 1200
    purpose: "Show 7-fold symmetrical Apoptosome pinwheel assembly"
    narration: "In the cytosol, Cytochrome c and Apaf-1 assemble the majestic seven-spoke apoptosome."
    hero_element: "Heptameric Apoptosome Engine"
    secondary_elements:
      - "7 Apaf-1 radial arms"
      - "Central Procaspase-9 hub"
    camera:
      shot_size: "Planar Geometric View"
      angle: "Top-down 0 degree perpendicular"
      movement: "Subtle orbital rotation (0 to 12 deg) + micro-push"
      depth: "800px"
    composition: "Symmetrical 7-fold wheel centered perfectly with radial energy lines"
    motion: "7 arms fold in sequentially (staggered 3 frames each); central hub flares"
    lighting: "High-contrast emerald and cyan radial gradients"
    typography: "Headline 'HEPTAMERIC APOPTOSOME', metric 'DIAMETER: 27 nm'"
    transition: "push-through central hub at frame 1186-1200"
    sound: "7 consecutive micro-clicks followed by deep resonant activation gong"
    technical_notes: "Hold fully assembled wheel for 40 frames before exit"

  - shot_id: "S05"
    start_frame: 1200
    end_frame: 1500
    purpose: "Show Caspase-3 execution cascade, ICAD cleavage, and DNA laddering"
    narration: "Active Caspase-9 unleashes Caspase-3, severing cellular scaffolds and fragmenting DNA."
    hero_element: "Active Executioner Caspase-3"
    secondary_elements:
      - "ICAD substrate bar"
      - "CAD nuclease activation"
      - "Inter-nucleosomal DNA fragments (180 bp)"
    camera:
      shot_size: "Kinetic Downward View"
      angle: "15 degree diagonal dive"
      movement: "Crane tracking downward"
      depth: "1100px"
    composition: "Protease cleavage on left, genomic DNA laddering on right"
    motion: "Laser-like cleavage line cuts ICAD substrate; 180bp DNA bars cascade downward"
    lighting: "High-contrast split lighting: cyan protease vs red alert cleavage points"
    typography: "Headline 'CASPASE-3 CASCADE', metric 'DNA FRAGMENTATION: 180-200 bp'"
    transition: "black-slam impact cut at frame 1488-1500"
    sound: "Sharp laser slice at frame 1260, bass drop on DNA cut"
    technical_notes: "Hold final fragmented state for 35 frames"

  - shot_id: "S06"
    start_frame: 1500
    end_frame: 1800
    purpose: "Therapeutic resolution: BH3 mimetics defeating cancer resistance"
    narration: "Targeted BH3 mimetics disarm BCL-2, compelling cancer cells to destroy themselves."
    hero_element: "Therapeutic Synthesis Master Card"
    secondary_elements:
      - "Venetoclax BH3-mimetic drug molecule"
      - "Re-established apoptotic death pathway"
    camera:
      shot_size: "Master Wide Pull Out"
      angle: "Straight-on centered"
      movement: "Wide crane pull 1.06 -> 1.00"
      depth: "1200px"
    composition: "Master summary overview bringing the entire pathway into harmonious balance"
    motion: "All core mechanisms re-enter in four quadrants; drug icon neutralizes BCL-2"
    lighting: "Authoritative golden cyan rim lighting, soft ambient glow"
    typography: "Hero title 'TARGETED BH3 MIMETICS', subtitle 'RESTORING APOPTOTIC VICTORY'"
    transition: "fade to black over last 20 frames"
    sound: "Triumphant warm chord resolution, soft fading reverberation"
    technical_notes: "Final title holds still for full 60 frames before fade"
