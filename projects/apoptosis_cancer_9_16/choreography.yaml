shots:
  - shot_id: "Shot01_Cancer_Survival"
    purpose: "معرفی قلعه نامیرای سلول سرطانی و مهار مسیر مرگ سلولی"
    duration_sec: 5.0
    narration:
      visible: "سلول سرطانی با تکیه بر پروتئین BCL-2، فرمان مرگ طبیعی را نادیده می‌گیرد."
      spoken: "سلول سرطانی با تکیه بر پروتئین بی‌سی‌ال دو، فرمان مرگ طبیعی را نادیده می‌گیرد."
      pronunciation: "سِلّولِ سَرَطانی با تَکیه بَر پِروتِئینِ بی‌سی‌اِل دو، فَرمانِ مَرگِ طَبیعی را نادیده می‌گیرد."
    camera:
      state: "ESTABLISH"
      framing: "کادر عمودی با تمرکز بر حجم میتوکندری در کانون تصویر"
    choreography:
      - id: "bcl2_shield"
        type: "inhibition"
        target: "Mitochondrial Membrane"
        action: "تشکیل سپر بازدارنده BCL-2 روی غشا"
        sfx: "subtle_light_shimmer"

  - shot_id: "Shot02_BH3_Inhibition"
    purpose: "ورود داروی هدفمند و خنثی‌سازی پروتئین محافظ"
    duration_sec: 7.0
    narration:
      visible: "اما مهارکننده‌های هدفمند BH3، سپر BCL-2 را می‌شکنند."
      spoken: "اما مهارکننده‌های هدفمند بی‌اچ‌تری، سپر بی‌سی‌ال دو را می‌شکنند."
      pronunciation: "اَمّا مَهارکُنَنده‌هایِ هَدَفمَندِ بیِ‌اِچ‌تری، سِپَرِ بی‌سی‌اِل دو را می‌شِکَنَند."
    camera:
      state: "PUSH_IN"
      framing: "نزدیک‌شدن دراماتیک عمودی به محل برخورد مولکولی"
    choreography:
      - id: "bh3_binding"
        type: "transformation"
        target: "BCL-2 Complex"
        action: "مهار و شکسته‌شدن سپر محافظ با افت روشنایی BCL-2"
        sfx: "cinematic_sub_impact"

  - shot_id: "Shot03_MOMP_Puncture"
    purpose: "الیگومریزاسیون BAX/BAK و رهایش سیتوکروم c"
    duration_sec: 8.0
    narration:
      visible: "با فعال شدن BAX، منافذ MOMP باز شده و سیتوکروم c آزاد می‌شود."
      spoken: "با فعال شدن بَکس، منافذ مامپ باز شده و سیتوکروم سی آزاد می‌شود."
      pronunciation: "با فَعّال شُدَنِ بَکْس، مَنافِذِ مامْپ باز شُده و سیتوکْرومِ سی آزاد می‌شَوَد."
    camera:
      state: "IMPACT"
      framing: "لرزش ناشی از شکافتن غشا و جریان رو به پایین ذرات فلورسنت"
    choreography:
      - id: "momp_rupture"
        type: "activation"
        target: "Outer Mitochondrial Membrane"
        action: "ایجاد منفذ درخشان و خروج آبشاری ذرات سیتوکروم c"
        sfx: "organic_membrane_tear"

  - shot_id: "Shot04_Execution_Apoptosome"
    purpose: "تشکیل آپوپتوزوم و فعال‌سازی کاسپازها"
    duration_sec: 10.0
    narration:
      visible: "تشکیل آپوپتوزوم، کاسپازهای مرگبار را فعال کرده و سلول خاموش می‌شود."
      spoken: "تشکیل آپوپتوزوم، کاسپازهای مرگبار را فعال کرده و سلول خاموش می‌شود."
      pronunciation: "تَشکیلِ آپوپْتوزوم، کاسْپازهایِ مَرگبار را فَعّال کَرده و سِلّول خاموش می‌شَوَد."
    camera:
      state: "PULL_OUT"
      framing: "عقب‌نشینی باشکوه و تاریک‌شدن تدریجی ساختار سرطانی"
    choreography:
      - id: "caspase_cascade"
        type: "sequential_propagation"
        target: "Apoptosome Core"
        action: "نشر حلقه ۷ ضلعی آپوپتوزوم و شکسته شدن ساختار داخلی"
        sfx: "deep_space_swell"
