آپوپتوز:
  preferred: "آپوپْتوز"
  ipa: "ʔɒpoptʰoːz"
  notes: "سکون روی پ اول و ت، واو کشیده"

میتوکندری:
  preferred: "میتوکُنْدری"
  ipa: "miːtokʰondriː"
  notes: "ضمه روی کاف، نون ساکن"

سیتوکروم سی:
  preferred: "سیتوکْرومِ سی"
  ipa: "siːtʰokʰroːme siː"
  notes: "کسره اضافه بین سیتوکروم و سی"

BCL-2:
  preferred: "بی‌سی‌اِل دو"
  ipa: "biː siː el do"
  notes: "حفظ تلفظ استاندارد حروف انگلیسی با شمارش فارسی"

BH3:
  preferred: "بی‌اِچ‌تری"
  ipa: "biː etʃ tʰriː"
  notes: "تلفظ پیوسته بدون مکث مصنوعی"

MOMP:
  preferred: "مامْپ"
  ipa: "mɒmp"
  notes: "الف کوتاه، میم ساکن"

کاسپاز:
  preferred: "کاسْپاز"
  ipa: "kʰɒːspɒːz"
  notes: "سین ساکن، پ کشیده"

آپوپتوزوم:
  preferred: "آپوپْتوزوم"
  ipa: "ʔɒpoptʰoːzoːm"
  notes: "تلفظ واو دوم کشیده"

سلول سرطانی:
  preferred: "سلولِ سرطانی"
  ipa: "sæluːle særætʰɒːniː"
  notes: "کسره اضافه واضح بین سلول و سرطانی"
